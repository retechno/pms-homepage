name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Until package-lock.json is committed, install from package.json and keep the lock file as an artifact.
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    needs: web
    permissions:
      contents: write
    env:
      # Sample values so the screenshots show the login link, the form and the footer links.
      VITE_APP_URL: https://app.example.com
      VITE_DEMO_ENDPOINT: https://example.com/demo-requests
      VITE_SALES_EMAIL: sales@example.com
      VITE_PRIVACY_URL: https://example.com/privacy
      VITE_TERMS_URL: https://example.com/terms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - id: qa
        continue-on-error: true
        run: |
          mkdir -p screenshots
          npx vite preview --port 4173 --strictPort &
          npx --yes wait-on@8 http://localhost:4173
          node scripts/qa.mjs http://localhost:4173 2>&1 | tee screenshots/log.txt
          exit ${PIPESTATUS[0]}
      # Screenshots, the check log and the lock file also go to the branch qa/<branch>, so they can be
      # reviewed where GitHub's artifact storage is not reachable.
      - name: Publish screenshots to qa/${{ github.head_ref || github.ref_name }}
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          QA_BRANCH: qa/${{ github.head_ref || github.ref_name }}
        run: |
          cp package-lock.json screenshots/ 2>/dev/null || true
          echo "${{ github.sha }}" > screenshots/commit.txt
          cd screenshots
          git init -q -b "$QA_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Browser checks of ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$QA_BRANCH"
      - if: steps.qa.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
